name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    permissions:
      contents: write # Required to create GitHub releases and upload assets.
      packages: write # Required to push the image to ghcr.io.
      actions: read # Required to read the CI gate runs for the tagged commit.
      id-token: write # Required to sign artifact provenance with GitHub OIDC.
      attestations: write # Required to store release artifact attestations.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, so it needs the whole history; a shallow clone silently
          # produces an empty changelog rather than failing.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      # Looser than the `mise run release` helper, which only cuts
      # vMAJOR.MINOR.PATCH. A prerelease tagged by hand is a supported path:
      # GoReleaser skips `latest` for it.
      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: '[[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

      - name: Check release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: mise run release:state

      # Validation happens in the ci and security workflows' push gates. This
      # workflow stays cache-free so release artifacts are never built from
      # cached state; it only waits for the gates covering the exact tagged
      # commit to go green. A tag on its own proves nothing about the commit:
      # without this, tagging a commit whose CI was red still publishes an
      # image, and to `latest`.
      - name: Await CI gates for tagged commit
        if: steps.release-state.outputs.state != 'published'
        # @clover: constraint=major tag-prefix=await-gates/ tags=actions
        uses: matcra587/github-actions/packages/await-gates@2340f3f78bb0853dbef8f6d80b97dd632bb06a65 # await-gates/v0.1.1
        with:
          gates: ci.yml security.yml

      - name: Check GoReleaser configuration
        if: steps.release-state.outputs.exists != 'true'
        run: mise run release:check

      # No QEMU step. See ci.yml, which builds both platforms on every push
      # and so keeps that assumption under test.
      - name: Set up Buildx
        if: steps.release-state.outputs.exists != 'true'
        # @clover: constraint=major tags=setup-buildx-action
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to ghcr.io
        if: steps.release-state.outputs.exists != 'true' || (!github.event.repository.private && steps.release-state.outputs.state == 'draft')
        # @clover: constraint=major tags=login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cosign is needed by GoReleaser on fresh public releases and by draft retries.
      - name: Install cosign
        if: ${{ !github.event.repository.private && steps.release-state.outputs.state != 'published' }}
        # @clover: constraint=major tags=cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # clover: provider=github repository=sigstore/cosign constraint=major
          cosign-release: v3.1.3

      - name: Run GoReleaser
        if: steps.release-state.outputs.exists != 'true'
        run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_RELEASE: ${{ !github.event.repository.private }}

      # Keyless signing uses public transparency services. Never execute these
      # steps for private repositories, including private prerelease tests.
      - name: Verify, attest and publish public release
        if: ${{ !github.event.repository.private && steps.release-state.outputs.state != 'published' }}
        # Pinned Actionlint and act do not support $/ yet; checkout uses the release commit.
        uses: ./.github/actions/finalize-release # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          recover-signatures: ${{ steps.release-state.outputs.state == 'draft' }}
